# Apache config for AbraFlexi Contractor

Alias /abraflexi-contractor /usr/share/abraflexi-contractor

<Directory /usr/share/abraflexi-contractor>
    Options SymLinksIfOwnerMatch
    DirectoryIndex index.php
    Require all granted

    # the web installer must be used from the local network only
    <Files "install.php">
        Require local
    </Files>

    <IfModule mod_php.c>
        php_admin_value open_basedir /tmp:/usr/share/abraflexi-contractor/:/usr/lib/abraflexi-contractor/:/etc/abraflexi/:/usr/share/php/:/usr/share/javascript/:/usr/share/locale
    </IfModule>
</Directory>
